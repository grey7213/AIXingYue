<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>加载中 · 惑梦</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: #f3ede3;
      color: #2b2b2b;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(circle at 16% 8%, rgba(239, 154, 95, .18), transparent 31rem),
        radial-gradient(circle at 88% 90%, rgba(129, 53, 78, .10), transparent 32rem),
        linear-gradient(145deg, #f7f2e9, #f0e7da 58%, #f7f4ee);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: .28;
      background-image:
        linear-gradient(rgba(91, 65, 44, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(91, 65, 44, .025) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(circle, #000 20%, transparent 78%);
    }
    .dialogue-host {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      background: #090806;
    }
    .dialogue-frame {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      opacity: 0;
      background: #090806;
      transition: opacity .28s ease;
    }
    body.is-ready .dialogue-frame { opacity: 1; }
    .launcher {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      padding: 1rem;
      background:
        radial-gradient(circle at 50% 44%, rgba(179, 121, 55, .1), transparent 26rem),
        rgba(9, 8, 6, .96);
      transition: opacity .24s ease, visibility .24s ease;
    }
    body.is-ready .launcher {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .launcher-card {
      width: min(31rem, calc(100vw - 2rem));
      padding: clamp(1.5rem, 5vw, 2.4rem);
      border: 1px solid #ece5d8;
      border-radius: 1.4rem;
      background: rgba(255, 255, 255, .91);
      box-shadow: 0 1.4rem 4rem rgba(76, 55, 38, .13), inset 0 1px rgba(255,255,255,.8);
      backdrop-filter: blur(24px);
      text-align: center;
    }
    .seal {
      width: 4.35rem;
      height: 4.35rem;
      margin: 0 auto 1.15rem;
      display: grid;
      place-items: center;
      border: 1px solid rgba(232, 131, 78, .34);
      border-radius: 1.15rem;
      background: linear-gradient(145deg, #ffe6cf, #ef9a5f);
      color: #6f263e;
      font-family: "STKaiti", "KaiTi", serif;
      font-size: 2rem;
      font-weight: 900;
      box-shadow: 0 0 0 .4rem rgba(232, 131, 78, .07), 0 .8rem 2.2rem rgba(137, 63, 44, .16);
      animation: breathe 1.8s ease-in-out infinite;
    }
    @keyframes breathe {
      50% { transform: translateY(-3px); box-shadow: 0 0 0 .55rem rgba(232, 131, 78, .1), 0 1rem 2.7rem rgba(137, 63, 44, .2); }
    }
    .eyebrow {
      margin: 0 0 .55rem;
      color: #e8834e;
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    h1 { margin: 0; color: #2b2b2b; font-size: clamp(1.35rem, 5vw, 1.8rem); letter-spacing: .03em; }
    #launcher-detail {
      min-height: 3.2rem;
      margin: .9rem auto 0;
      color: #6b6b6b;
      font-size: .9rem;
      line-height: 1.75;
    }
    .progress {
      height: 3px;
      margin: 1.4rem 0 0;
      overflow: hidden;
      border-radius: 999px;
      background: #f3ede3;
    }
    .progress::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, #e8834e, transparent);
      animation: travel 1.25s ease-in-out infinite;
    }
    @keyframes travel { from { transform: translateX(-110%); } to { transform: translateX(330%); } }
    .actions {
      display: none;
      gap: .65rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 1.35rem;
    }
    body.is-error .actions { display: flex; }
    body.is-error .progress { display: none; }
    body.is-error .seal { animation: none; filter: saturate(.72); }
    button, a {
      min-height: 2.55rem;
      padding: 0 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #e5d9c8;
      border-radius: .75rem;
      background: #faf6ef;
      color: #4c3d33;
      font: inherit;
      font-size: .82rem;
      font-weight: 750;
      text-decoration: none;
      cursor: pointer;
    }
    button { border-color: #e8834e; background: #e8834e; color: #fff; }
    button:hover, a:hover { filter: brightness(1.04); transform: translateY(-1px); }
    .foot { margin: 1.4rem 0 0; color: #9a8d7c; font-size: .68rem; letter-spacing: .08em; }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; background: #1d1b18; color: #ece7de; }
      body { background: radial-gradient(circle at 18% 10%, rgba(232,131,78,.14), transparent 30rem), linear-gradient(145deg, #171411, #211d19 55%, #141210); }
      main { border-color: #37332d; background: rgba(38,35,32,.93); box-shadow: 0 2rem 5rem rgba(0,0,0,.42); }
      h1 { color: #ece7de; }
      #launcher-detail { color: #b7b0a4; }
      .progress { background: #37332d; }
      a { border-color: #484037; background: #2c2925; color: #ece7de; }
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (prefers-reduced-motion: reduce) {
      .seal, .progress::after { animation: none; }
      button:hover, a:hover { transform: none; }
      .dialogue-frame, .launcher { transition: none; }
    }
  </style>
</head>
<body>
  <main class="dialogue-host" aria-label="惑梦对话">
    <iframe
      id="dialogue-frame"
      class="dialogue-frame"
      title="惑梦对话"
      name="homer-dialogue-module"
      sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-modals allow-popups allow-popups-to-escape-sandbox"
      allow="autoplay; clipboard-read; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      referrerpolicy="same-origin"
    ></iframe>
  </main>
  <section class="launcher" aria-live="polite" aria-busy="true">
    <div class="launcher-card">
      <div class="seal" aria-hidden="true">梦</div>
      <p class="eyebrow">惑梦</p>
      <h1 id="launcher-title">加载中</h1>
      <p id="launcher-detail">正在准备对话…</p>
      <div class="progress" aria-hidden="true"></div>
      <div class="actions">
        <button id="launcher-retry" type="button">重新连接</button>
        <a href="/app/histories.html">历史会话</a>
        <a href="/app/explore.html">返回探索</a>
      </div>
      <p class="foot">HOMER</p>
    </div>
  </section>

  <p id="dialogue-announcer" class="sr-only" aria-live="assertive"></p>
  <noscript>需要启用 JavaScript 才能进入对话。</noscript>
  <script type="module" src="/app/assets/js/chat.js?v=20260802-apk-ready"></script>
</body>
</html>
