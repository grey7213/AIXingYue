<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>编辑资源 · 惑梦</title><link rel="stylesheet" href="/app/assets/css/workshop-resource.css"><script>try{document.documentElement.dataset.theme=localStorage.getItem('ai_xingyue_shell_theme')||'light'}catch{}</script><script type="module" src="/app/assets/js/workshop-resource.js"></script></head>
<body><header class="resource-header"><a class="resource-back" id="resource-back" aria-label="返回资源列表">‹</a><h1 id="resource-title">编辑资源</h1><button class="resource-button primary" id="resource-save" form="resource-form">保存</button></header><main class="resource-main"><div id="resource-status" class="resource-status" role="status"></div><form id="resource-form"><section class="resource-section"><h2>基本信息</h2><label class="resource-field"><span>名称</span><input name="name" required maxlength="120" placeholder="给资源起个容易辨认的名字"></label><label class="resource-field"><span>简介</span><textarea name="summary" maxlength="2000" placeholder="说明用途和适合的使用场景"></textarea></label><div class="resource-checks"><label><input name="is_public" type="checkbox">公开到作品库</label><label><input name="is_open_source" type="checkbox">允许查看源内容</label></div></section><section class="resource-section" id="resource-content-section"><h2>资源内容</h2><label class="resource-import">从文件导入<input id="resource-file" type="file" accept=".json,application/json"><small>导入后检查并保存，未勾选公开时仅自己可见。</small></label><p id="resource-count">尚未导入内容</p><details id="resource-source"><summary>查看与编辑内容</summary><label class="resource-field code"><span>源内容</span><textarea name="content" spellcheck="false" aria-label="资源源内容"></textarea></label></details><label class="resource-field" id="resource-demo-field" hidden><span>演示页面（HTML）</span><textarea name="demo_html" spellcheck="false"></textarea></label></section><section class="resource-section" id="resource-regex-preview" hidden><h2>正则效果预览</h2><p>按规则顺序替换测试文本。预览不会修改聊天，也不会执行页面脚本。</p><label class="resource-field"><span>测试文本</span><textarea id="regex-sample" maxlength="32768" placeholder="在这里输入或粘贴要测试的角色回复"></textarea></label><button type="button" class="resource-button" id="regex-run">预览效果</button><p id="regex-status" role="status"></p><div class="resource-preview-grid"><div><h3>替换后文本</h3><pre id="regex-output"></pre></div><div><h3>页面效果</h3><iframe title="正则页面预览" id="regex-frame" class="resource-preview-frame" sandbox="" referrerpolicy="no-referrer"></iframe></div></div></section><section class="resource-section" id="resource-version-fields" hidden><h2>发布新版本</h2><label class="resource-field"><span>版本名称</span><input name="version_name" maxlength="80" placeholder="例如 v1.1"></label><label class="resource-field"><span>更新说明</span><textarea name="version_description" maxlength="2000" placeholder="这次调整了什么"></textarea></label></section></form><div class="resource-actions"><button type="button" id="resource-export" class="resource-button">导出文件</button><button type="button" id="resource-favorite" class="resource-button" hidden>收藏</button><button type="button" id="resource-delete" class="resource-button danger" hidden>删除资源</button></div><section id="resource-versions" class="resource-section" hidden><h2>历史版本</h2><div></div></section></main></body></html>
